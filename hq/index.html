<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DARCO VOICE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#171717;font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:#fff;border:1px solid #e3ded5;border-radius:22px;padding:28px}.brand{font-weight:900;font-size:24px}.muted{color:#777}.h{font-size:28px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choices button{border:1px solid #ddd;background:#faf9f6;border-radius:11px;padding:11px}.choices button.on{background:#171717;color:#fff}.btn{width:100%;border:0;background:#171717;color:#fff;padding:13px;border-radius:11px;margin-top:16px}label{display:block;color:#777;font-size:12px;margin:14px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff}textarea{min-height:100px}.success{text-align:center;padding:30px}.emoji{font-size:50px}.shell{min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:230px;background:#171717;color:#fff;padding:22px 14px}.side h2{margin:0 8px 28px}.side button{display:block;width:100%;border:0;background:transparent;color:#aaa;text-align:right;padding:11px;border-radius:9px}.main{margin-right:230px;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.logout{border:0;background:#eee;border-radius:9px;padding:9px 13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi,.panel{background:#fff;border:1px solid #e3ded5;border-radius:16px;padding:18px}.kpi strong{display:block;font-size:27px;margin-top:8px}.panels{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.row small{display:block}.badge{background:#eee;border-radius:8px;padding:4px 7px;font-size:10px;height:max-content}.error{background:#f8e0e0;color:#8b3030;padding:10px;border-radius:9px;margin-top:10px}.ok{background:#e3f1e7;color:#27633f;padding:10px;border-radius:9px;margin-top:10px}.empty{text-align:center;color:#888;padding:25px}@media(max-width:800px){.side{position:static;width:100%;display:flex;overflow:auto;padding:10px}.side h2{white-space:nowrap}.side button{width:auto;white-space:nowrap}.main{margin:0;padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.choices{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div><script>
(function(){
'use strict';
const db=window.supabase.createClient('https://jcpdzqilnhnljvrfsjug.supabase.co','sb_publishable_IsYn6XHFo7AUOfE0BDyfZA_sjavx6Vr');
const app=document.getElementById('app'),MODE='hq';
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card=x=>'<div class="wrap"><div class="card">'+x+'</div></div>';
const branch=async()=>{const r=await db.from('dv_branches').select('*').eq('code','GILAVAND').single();if(r.error)throw r.error;return r.data;};
function customer(){
 const s={overall:0,coffee:0,staff:0,service:0,environment:0,comment:'',contact:false,phone:'',time:''};let step=0;
 function render(){
  let h='<div class="brand">DARCO VOICE</div>';
  if(step===0)h+='<h1 class="h">تجربه‌ات با دارکو چطور بود؟</h1><p class="muted">۳۰ ثانیه وقت می‌گیرد، ولی به ما کمک می‌کند بهتر شویم.</p><button id="start" class="btn">شروع کنیم</button>';
  if(step===1)h+='<h2>در مجموع، تجربه‌ات چطور بود؟</h2><div class="choices">'+['خیلی بد','بد','معمولی','خوب','عالی'].map((x,i)=>'<button data-o="'+(i+1)+'">'+x+'</button>').join('')+'</div>';
  if(step===2)h+='<h2>چند بخش را هم ارزیابی کن</h2>'+[['coffee','کیفیت قهوه'],['staff','برخورد پرسنل'],['service','سرعت سرویس'],['environment','فضای دارکو']].map(z=>'<label>'+z[1]+'</label><div class="choices">'+[1,2,3,4,5].map(n=>'<button data-k="'+z[0]+'" data-v="'+n+'" class="'+(s[z[0]]===n?'on':'')+'">'+n+'</button>').join('')+'</div>').join('')+'<button id="next2" class="btn">ادامه</button>';
  if(step===3)h+='<h2>اگر فقط یک چیز را بهتر کنیم، چی باشد؟</h2><textarea id="comment">'+esc(s.comment)+'</textarea><button id="next3" class="btn">ادامه</button>';
  if(step===4)h+='<h2>دوست داری اگر لازم بود باهات تماس بگیریم؟</h2><div class="choices"><button id="yes" class="'+(s.contact?'on':'')+'">بله</button><button id="no" class="'+(!s.contact?'on':'')+'">نه</button></div>'+(s.contact?'<label>شماره موبایل</label><input id="phone" value="'+esc(s.phone)+'"><label>زمان مناسب تماس</label><input id="time" value="'+esc(s.time)+'">':'')+'<button id="submit" class="btn">ثبت بازخورد</button><div id="msg"></div>';
  if(step===5)h='<div class="success"><div class="emoji">☕</div><h2>ممنون که صدات را با ما به اشتراک گذاشتی.</h2><p class="muted">صدای تو بخشی از بهتر شدن دارکوئه.</p></div>';
  app.innerHTML=card(h);
  const q=id=>document.getElementById(id);
  if(q('start'))q('start').onclick=()=>{step=1;render();};
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{s.overall=+b.dataset.o;step=2;render();});
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{s[b.dataset.k]=+b.dataset.v;render();});
  if(q('next2'))q('next2').onclick=()=>{if([s.coffee,s.staff,s.service,s.environment].every(Boolean)){step=3;render();}};
  if(q('next3'))q('next3').onclick=()=>{s.comment=q('comment').value;step=4;render();};
  if(q('yes'))q('yes').onclick=()=>{s.contact=true;render();};if(q('no'))q('no').onclick=()=>{s.contact=false;render();};
  if(q('submit'))q('submit').onclick=async()=>{q('submit').disabled=true;try{s.phone=q('phone')?.value||'';s.time=q('time')?.value||'';const b=await branch();const r=await db.from('dv_customer_feedback').insert({branch_id:b.id,source:new URLSearchParams(location.search).get('source')||'table_qr',overall_score:s.overall,coffee_score:s.coffee,staff_score:s.staff,service_score:s.service,environment_score:s.environment,comment:s.comment,contact_requested:s.contact,phone:s.contact?s.phone:null,preferred_contact_time:s.contact?s.time:null,status:'new'});if(r.error)throw r.error;step=5;render();}catch(e){q('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>';q('submit').disabled=false;}};
 }render();
}
function go(p){location.href=location.origin+'/darco-voice'+p;}
function nav(){return '<aside class="side"><h2>DARCO VOICE</h2><button data-nav="/hq">Manager HQ</button><button data-nav="/staff">Staff Voice</button><button data-nav="/customer">فرم مشتری</button><button id="logout">خروج</button></aside>';}
function bindNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));const x=document.getElementById('logout');if(x)x.onclick=async()=>{await db.auth.signOut();go('/hq');};}
async function profile(u){const r=await db.from('dv_profiles').select('*').eq('id',u.id).single();if(r.error)throw r.error;return r.data;}
function login(title,done){app.innerHTML=card('<div class="brand">DARCO VOICE</div><h2>'+title+'</h2><label>ایمیل</label><input id="email" type="email"><label>رمز عبور</label><input id="pass" type="password"><button id="login" class="btn">ورود</button><div id="msg"></div>');document.getElementById('login').onclick=async()=>{const b=document.getElementById('login');b.disabled=true;const r=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});if(r.error){document.getElementById('msg').innerHTML='<div class="error">'+esc(r.error.message)+'</div>';b.disabled=false;return;}try{await done(r.data.user);}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>';await db.auth.signOut();b.disabled=false;}};}
async function hq(u){const p=await profile(u);if(!['manager','admin'].includes(p.role))throw Error('این حساب دسترسی Manager ندارد.');const r=await db.from('dv_customer_feedback').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;const d=r.data||[],avg=d.length?(d.reduce((a,x)=>a+Number(x.overall_score||0),0)/d.length).toFixed(1):'0.0',sat=d.length?Math.round(d.filter(x=>+x.overall_score>=4).length/d.length*100):0;app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="top"><div><h1>Manager HQ</h1><p class="muted">مرکز فرماندهی تجربه مشتری</p></div></div><div class="kpis"><div class="kpi">رضایت میانگین<strong>'+avg+'/5</strong></div><div class="kpi">نرخ رضایت<strong>'+sat+'%</strong></div><div class="kpi">بازخورد<strong>'+d.length+'</strong></div><div class="kpi">نیازمند تماس<strong>'+d.filter(x=>x.contact_requested).length+'</strong></div></div><div class="panels"><section class="panel"><h3>آخرین صدای مشتری</h3>'+(d.slice(0,15).map(x=>'<div class="row"><span><b>'+esc(x.overall_score)+'/5</b> '+esc(x.comment||'بدون توضیح')+'<small class="muted">'+new Date(x.created_at).toLocaleString('fa-IR')+'</small></span><span class="badge">'+(x.contact_requested?'تماس':'بدون تماس')+'</span></div>').join('')||'<div class="empty">هنوز بازخوردی ثبت نشده.</div>')+'</section><section class="panel"><h3>امتیاز دسته‌ها</h3>'+[['کیفیت قهوه','coffee_score'],['برخورد پرسنل','staff_score'],['سرعت سرویس','service_score'],['فضا','environment_score']].map(z=>'<div class="row"><span>'+z[0]+'</span><b>'+(d.length?(d.reduce((a,x)=>a+Number(x[z[1]]||0),0)/d.length).toFixed(1):'0.0')+'/5</b></div>').join('')+'</section></div></main></div>';bindNav();}
async function staff(u){const p=await profile(u);if(p.role!=='staff')throw Error('این حساب دسترسی Staff ندارد.');const r=await db.from('dv_staff_reports').select('*').eq('staff_id',u.id).order('created_at',{ascending:false}),rs=r.data||[];app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="top"><div><h1>Staff Voice</h1><p class="muted">سلام '+esc(p.full_name||'')+'، گزارش شیفت را ثبت کن.</p></div></div><div class="panels"><section class="panel"><h3>گزارش شیفت</h3><label>وضعیت کلی</label><div class="choices"><button data-s="good">خوب</button><button data-s="normal">معمولی</button><button data-s="bad">بد</button></div><label>چه اتفاقی افتاد؟</label><textarea id="desc"></textarea><label>اگر فردا یک چیز را تغییر می‌دادی؟</label><textarea id="suggest"></textarea><button id="save" class="btn">ثبت گزارش</button><div id="msg"></div></section><section class="panel"><h3>گزارش‌های من</h3>'+(rs.map(x=>'<div class="row"><span>'+esc(x.description||'بدون توضیح')+'<small>'+new Date(x.created_at).toLocaleString('fa-IR')+'</small></span><span class="badge">'+esc(x.overall_shift_status)+'</span></div>').join('')||'<div class="empty">هنوز گزارشی ثبت نشده.</div>')+'</section></div></main></div>';bindNav();let status='normal';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');});document.getElementById('save').onclick=async()=>{const b=await branch(),x=await db.from('dv_staff_reports').insert({staff_id:u.id,branch_id:b.id,shift:'current',overall_shift_status:status,description:document.getElementById('desc').value,customer_pattern:'',suggestion:document.getElementById('suggest').value});document.getElementById('msg').innerHTML=x.error?'<div class="error">'+esc(x.error.message)+'</div>':'<div class="ok">گزارش با موفقیت ثبت شد.</div>';};}
async function start(){try{if(MODE==='customer'){customer();return;}const s=(await db.auth.getSession()).data.session;if(!s){login(MODE==='hq'?'Manager HQ':'Staff Voice',MODE==='hq'?hq:staff);return;}if(MODE==='hq')await hq(s.user);else await staff(s.user);}catch(e){app.innerHTML=card('<div class="brand">DARCO VOICE</div><h2>خطا</h2><div class="error">'+esc(e.message)+'</div>');}}
start();
})();
</script></body></html>
