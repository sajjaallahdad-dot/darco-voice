<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARCO VOICE | Manager HQ</title>
<style>
:root{--ink:#151515;--cream:#f5f0e7;--paper:#fffdf9;--line:#e8e1d6;--muted:#8a847a;--accent:#c9362b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#fff9ef 0,#f5f0e7 45%,#eee8de 100%);color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(45,37,25,.12)}.brand{font-weight:900;font-size:18px;display:flex;gap:9px;align-items:center}.brand:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}h1{font-size:34px;margin:55px 0 10px}h2{font-size:28px;margin:38px 0 20px}.muted{color:var(--muted);line-height:1.9}label{display:block;color:#716b61;font-size:12px;font-weight:700;margin:22px 0 8px}input{width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0}input:focus{border-color:#8e867a;box-shadow:0 0 0 4px rgba(21,21,21,.05)}.btn{width:100%;border:0;background:var(--ink);color:#fff;padding:15px;border-radius:14px;margin-top:22px;font-weight:800}.btn:disabled{opacity:.55}.error{background:#fff0ee;color:#9d2f28;border:1px solid #f2c7c2;padding:13px 15px;border-radius:13px;margin-top:12px}.shell{min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:235px;background:#111;color:#fff;padding:28px 18px}.side h2{margin:0 10px 40px;font-size:20px}.side button{display:block;width:100%;border:0;background:transparent;color:#aaa;text-align:right;padding:13px 12px;border-radius:12px;margin:4px 0}.side button:hover{background:#222;color:#fff}.main{margin-right:235px;padding:40px;max-width:1450px}.top{margin-bottom:25px}.top h1{margin:0;font-size:38px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi,.panel{background:rgba(255,253,249,.95);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 35px rgba(45,37,25,.055)}.kpi:before{content:"";display:block;width:28px;height:3px;background:var(--accent);margin-bottom:16px}.kpi strong{display:block;font-size:31px;margin-top:8px}.panels{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #eee8de;padding:15px 0;line-height:1.8}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:4px}.badge{background:#f0ebe2;border-radius:999px;padding:5px 10px;font-size:10px;height:max-content;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:40px 20px}
@media(max-width:900px){.side{position:static;width:100%;display:flex;gap:4px;overflow:auto;padding:10px}.side h2{white-space:nowrap;margin:0 12px 0 4px}.side button{width:auto;white-space:nowrap}.main{margin:0;padding:20px 14px 40px}.kpis{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:560px){.card{padding:25px 20px}.kpi{padding:16px}.kpi strong{font-size:25px}.panel{padding:16px}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
'use strict';
const ENDPOINT='https://jcpdzqilnhnljvrfsjug.supabase.co/functions/v1/darco-manager-gateway';
const app=document.getElementById('app');
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card=x=>'<div class="wrap"><div class="card">'+x+'</div></div>';
const nav=()=>'<aside class="side"><h2>DARCO VOICE</h2><button id="refresh">Manager HQ</button><button id="logout">خروج</button></aside>';
const getToken=()=>sessionStorage.getItem('darco_manager_token');
const setToken=t=>sessionStorage.setItem('darco_manager_token',t);
const logout=()=>{sessionStorage.removeItem('darco_manager_token');location.reload();};

function login(){
 app.innerHTML=card('<div class="brand">DARCO VOICE</div><h1>Manager HQ</h1><p class="muted">ورود مدیر با یک رمز عبور انجام می‌شود.</p><label>رمز عبور مدیر</label><input id="pass" type="password" autocomplete="current-password" autofocus><button id="login" class="btn">ورود به پنل</button><div id="msg"></div>');
 const pass=document.getElementById('pass'),btn=document.getElementById('login'),msg=document.getElementById('msg');
 const submit=async()=>{btn.disabled=true;msg.innerHTML='';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:pass.value})});const x=await r.json();if(!r.ok)throw Error(x.error||'ورود ناموفق بود.');setToken(x.token);await dashboard();}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>';btn.disabled=false;}};
 btn.onclick=submit;pass.onkeydown=e=>{if(e.key==='Enter')submit();};
}

async function dashboard(){
 const token=getToken();if(!token){login();return;}
 try{
  const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'dashboard',token})});
  const x=await r.json();if(!r.ok){sessionStorage.removeItem('darco_manager_token');login();return;}render(x.data||[]);
 }catch(e){app.innerHTML=card('<div class="brand">DARCO VOICE</div><h2>خطا</h2><div class="error">'+esc(e.message)+'</div><button class="btn" onclick="location.reload()">تلاش دوباره</button>');}
}

function render(d){
 const avg=d.length?(d.reduce((a,x)=>a+Number(x.overall_score||0),0)/d.length).toFixed(1):'0.0';
 const sat=d.length?Math.round(d.filter(x=>Number(x.overall_score)>=4).length/d.length*100):0;
 const calls=d.filter(x=>x.contact_requested).length;
 const cat=(key)=>d.length?(d.reduce((a,x)=>a+Number(x[key]||0),0)/d.length).toFixed(1):'0.0';
 app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="top"><h1>Manager HQ</h1><p class="muted">مرکز فرماندهی تجربه مشتری دارکو</p></div><div class="kpis"><div class="kpi">رضایت میانگین<strong>'+avg+'/5</strong></div><div class="kpi">نرخ رضایت<strong>'+sat+'%</strong></div><div class="kpi">بازخورد<strong>'+d.length+'</strong></div><div class="kpi">نیازمند تماس<strong>'+calls+'</strong></div></div><div class="panels"><section class="panel"><h3>آخرین صدای مشتری</h3>'+(d.slice(0,15).map(x=>'<div class="row"><span><b>'+esc(x.overall_score)+'/5</b> '+esc(x.comment||'بدون توضیح')+'<small>'+new Date(x.created_at).toLocaleString('fa-IR')+'</small></span><span class="badge">'+(x.contact_requested?'تماس':'بدون تماس')+'</span></div>').join('')||'<div class="empty">هنوز بازخوردی ثبت نشده.</div>')+'</section><section class="panel"><h3>امتیاز دسته‌ها</h3>'+[['کیفیت قهوه','coffee_score'],['برخورد پرسنل','staff_score'],['سرعت سرویس','service_score'],['فضا','environment_score']].map(z=>'<div class="row"><span>'+z[0]+'</span><b>'+cat(z[1])+'/5</b></div>').join('')+'</section></div></main></div>';
 document.getElementById('logout').onclick=logout;
 document.getElementById('refresh').onclick=dashboard;
}
dashboard();
})();
</script></body></html>
