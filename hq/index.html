<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>DARCO VOICE | Manager HQ</title>
<style>
:root{--ink:#111;--cream:#f4efe6;--paper:#fffdf9;--line:#e7dfd2;--muted:#817a70;--red:#c9352b;--green:#2f7a57;--amber:#b87918;--danger:#a52f29}
*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;color:var(--ink);background:linear-gradient(145deg,#fbf7ef 0,#f2ece2 100%);font-family:Tahoma,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 28px 90px rgba(38,31,20,.14)}.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.4px}.brand-dot{width:11px;height:11px;background:var(--red);border-radius:50%}.login-card h1{font-size:34px;margin:52px 0 8px}.muted{color:var(--muted);line-height:1.9}.label{display:block;font-size:12px;font-weight:800;color:#686157;margin:24px 0 8px}.login-card input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;outline:0}.login-card input:focus{border-color:#8f887e;box-shadow:0 0 0 4px rgba(17,17,17,.05)}.primary{border:0;background:var(--ink);color:#fff;border-radius:14px;padding:15px 18px;font-weight:900}.login-card .primary{width:100%;margin-top:18px}.error{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff0ee;color:var(--danger);border:1px solid #f0c8c3}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:#111;color:#fff;padding:26px 17px;z-index:20}.sidebar .brand{padding:0 10px 34px}.sidebar nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#a9a9a9;text-align:right;padding:13px 12px;border-radius:12px;margin:4px 0}.sidebar nav button.active,.sidebar nav button:hover{background:#202020;color:#fff}.sidebar .bottom{position:absolute;bottom:20px;left:17px;right:17px}.sidebar .logout{color:#e98c85}.main{margin-left:238px;min-height:100vh;padding:28px clamp(18px,3vw,44px) 60px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--red);font-weight:950;letter-spacing:1.3px}.topbar h1{font-size:clamp(25px,3vw,38px);margin:6px 0}.top-actions{display:flex;gap:8px}.ghost{border:1px solid var(--line);background:rgba(255,253,249,.8);padding:10px 13px;border-radius:12px;font-weight:800}.mobile-nav{display:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filter{border:1px solid var(--line);background:rgba(255,253,249,.86);padding:9px 12px;border-radius:11px;color:#5e584f;font-size:12px}.filter.active{background:#111;color:#fff;border-color:#111}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:18px;padding:18px;min-height:124px;position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:0;top:0;width:4px;height:100%;background:var(--red)}.kpi .k-label{font-size:12px;color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:30px;margin-top:17px}.kpi small{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);gap:14px;margin-top:14px}.panel{background:rgba(255,253,249,.95);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel-head h2{font-size:17px;margin:0}.panel-head span{font-size:11px;color:var(--muted)}
.attention{display:grid;grid-template-columns:1fr 1fr;gap:9px}.attention-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.attention-card strong{font-size:23px}.attention-card small{display:block;color:var(--muted);margin-top:6px}
.bar-row{margin:15px 0}.bar-meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.bar-track{height:8px;background:#eee8df;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:#111;border-radius:99px}.bar-fill.red{background:var(--red)}
.feedback-list{display:flex;flex-direction:column}.feedback{border-top:1px solid var(--line);padding:14px 0;cursor:pointer}.feedback:first-child{border-top:0}.feedback-main{display:flex;justify-content:space-between;gap:14px}.feedback-title{display:flex;align-items:center;gap:9px;font-weight:900}.score{display:inline-flex;align-items:center;justify-content:center;min-width:39px;height:29px;padding:0 8px;border-radius:9px;background:#111;color:#fff;font-size:12px}.feedback p{margin:7px 0 5px;color:#4e4942;font-size:13px;line-height:1.8}.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:10px}.pill{padding:4px 8px;border-radius:99px;background:#f0ebe3}.pill.red{background:#fff0ee;color:var(--red)}.pill.green{background:#edf7f0;color:var(--green)}
.empty{text-align:center;padding:40px 15px;color:var(--muted);line-height:2}.empty strong{display:block;color:#2b2824;margin-bottom:6px}
.source-list{display:flex;flex-direction:column;gap:10px}.source-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.source-row:last-child{border-bottom:0}.source-row b{font-size:13px}.source-row span{font-size:12px;color:var(--muted)}
.drawer{position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:50;display:none}.drawer.open{display:block}.drawer-card{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--paper);padding:24px;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.15)}.drawer-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.close{border:0;background:#eee8df;border-radius:10px;width:38px;height:38px}.detail-score{font-size:52px;font-weight:950;margin:28px 0 8px}.detail-block{border-top:1px solid var(--line);padding:15px 0}.detail-block label{font-size:10px;color:var(--muted);font-weight:900;display:block;margin-bottom:7px}.detail-comment{line-height:2;background:#f7f2e9;border-radius:13px;padding:14px}.status-row{display:flex;gap:7px;flex-wrap:wrap}.status-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:11px}.status-btn.active{background:#111;color:#fff;border-color:#111}
@media(max-width:1050px){.sidebar{width:205px}.main{margin-left:205px}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:700px){body{padding-bottom:72px}.sidebar{display:none}.main{margin:0;padding:18px 13px 35px}.topbar{align-items:flex-start}.topbar h1{font-size:27px}.top-actions .ghost{font-size:11px}.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);bottom:0;left:0;right:0;height:68px;background:rgba(17,17,17,.98);z-index:40;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));gap:5px}.mobile-nav button{border:0;background:transparent;color:#aaa;border-radius:11px;font-size:10px}.mobile-nav button.active{background:#242424;color:#fff}.filters{overflow:auto;flex-wrap:nowrap;padding-bottom:2px}.filter{white-space:nowrap}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kpi{min-height:106px;padding:15px}.kpi strong{font-size:24px;margin-top:13px}.panel{padding:15px;border-radius:17px}.attention{grid-template-columns:1fr 1fr}.drawer-card{padding:19px}.feedback-main{gap:8px}.feedback-title{font-size:12px}.feedback p{font-size:12px}}
@media(max-width:390px){.kpis{grid-template-columns:1fr 1fr}.kpi strong{font-size:21px}.attention{grid-template-columns:1fr}.top-actions .ghost{padding:8px}.panel-head h2{font-size:15px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const ENDPOINT='https://jcpdzqilnhnljvrfsjug.supabase.co/functions/v1/darco-manager-gateway';
const app=document.getElementById('app');
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const token=()=>sessionStorage.getItem('darco_manager_token');
const logout=()=>{sessionStorage.removeItem('darco_manager_token');location.reload()};
let all=[], activeView='dashboard', filter='all';

function login(){
 app.innerHTML='<div class="wrap"><div class="login-card"><div class="brand"><span class="brand-dot"></span>DARCO VOICE</div><h1>Manager HQ</h1><p class="muted">مرکز فرماندهی تجربه مشتری. ورود مدیر با یک رمز عبور انجام می‌شود.</p><label class="label">رمز عبور مدیر</label><input id="pass" type="password" autocomplete="current-password" autofocus><button id="login" class="primary">ورود به پنل</button><div id="msg"></div></div></div>';
 const p=document.getElementById('pass'),b=document.getElementById('login'),m=document.getElementById('msg');
 const submit=async()=>{b.disabled=true;m.innerHTML='';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:p.value})});const x=await r.json();if(!r.ok)throw Error(x.error||'ورود ناموفق بود.');sessionStorage.setItem('darco_manager_token',x.token);load()}catch(e){m.innerHTML='<div class="error">'+esc(e.message)+'</div>';b.disabled=false}};
 b.onclick=submit;p.onkeydown=e=>{if(e.key==='Enter')submit()};
}
async function load(){
 if(!token()){login();return}
 try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'dashboard',token:token()})});const x=await r.json();if(!r.ok){sessionStorage.removeItem('darco_manager_token');login();return}all=Array.isArray(x.data)?x.data:[];render()}catch(e){app.innerHTML='<div class="wrap"><div class="login-card"><div class="brand"><span class="brand-dot"></span>DARCO VOICE</div><h2>اتصال برقرار نشد</h2><p class="muted">'+esc(e.message)+'</p><button class="primary" onclick="location.reload()">تلاش دوباره</button></div></div>'}
}
const avg=(arr,key)=>arr.length?(arr.reduce((s,x)=>s+Number(x[key]||0),0)/arr.length).toFixed(1):'0.0';
const labelSource=s=>({table_qr:'QR میز',instagram:'اینستاگرام',billboard:'بیلبورد',sms:'SMS',visit:'ویزیت',snappfood:'اسنپ‌فود'}[s]||s||'نامشخص');
const scoreClass=n=>Number(n)>=4?'green':Number(n)<=2?'red':'';
function filtered(){if(filter==='contact')return all.filter(x=>x.contact_requested);if(filter==='low')return all.filter(x=>Number(x.overall_score)<=2);if(filter==='new')return all.filter(x=>(x.status||'new')==='new');return all}
function render(){
 const d=all, f=filtered();
 const avgAll=avg(d,'overall_score'), sat=d.length?Math.round(d.filter(x=>Number(x.overall_score)>=4).length/d.length*100):0, calls=d.filter(x=>x.contact_requested).length, low=d.filter(x=>Number(x.overall_score)<=2).length;
 const cats=[['کیفیت قهوه','coffee_score'],['برخورد پرسنل','staff_score'],['سرعت سرویس','service_score'],['فضا','environment_score']];
 const sources={};d.forEach(x=>sources[x.source||'unknown']=(sources[x.source||'unknown']||0)+1);
 app.innerHTML='<div class="app">'+
 '<aside class="sidebar"><div class="brand"><span class="brand-dot"></span>DARCO VOICE</div><nav><button class="'+(activeView==='dashboard'?'active':'')+'" id="navDash">⌂ داشبورد</button><button class="'+(activeView==='feedback'?'active':'')+'" id="navFeed">◉ بازخوردها</button><button class="'+(activeView==='insights'?'active':'')+'" id="navInsight">◌ تحلیل</button></nav><div class="bottom"><button class="logout" id="logout">↪ خروج</button></div></aside>'+
 '<main class="main"><div class="topbar"><div><div class="eyebrow">DARCO / VOICE CONTROL</div><h1>'+({dashboard:'داشبورد تجربه مشتری',feedback:'صدای مشتری',insights:'تحلیل تجربه'}[activeView])+'</h1><div class="muted" style="font-size:12px">دارکو گیلواند · داده‌های واقعی پنل</div></div><div class="top-actions"><button class="ghost" id="refresh">↻ بروزرسانی</button></div></div>'+
 '<div class="filters"><button class="filter '+(filter==='all'?'active':'')+'" data-filter="all">همه</button><button class="filter '+(filter==='contact'?'active':'')+'" data-filter="contact">نیازمند تماس · '+calls+'</button><button class="filter '+(filter==='low'?'active':'')+'" data-filter="low">امتیاز پایین · '+low+'</button><button class="filter '+(filter==='new'?'active':'')+'" data-filter="new">جدید</button></div>'+
 '<section class="kpis"><div class="kpi"><span class="k-label">رضایت میانگین</span><strong>'+avgAll+'<small>/5</small></strong></div><div class="kpi"><span class="k-label">نرخ رضایت</span><strong>'+sat+'%</strong><small>امتیاز ۴ و ۵</small></div><div class="kpi"><span class="k-label">کل بازخورد</span><strong>'+d.length+'</strong><small>ثبت‌شده</small></div><div class="kpi"><span class="k-label">نیازمند پیگیری</span><strong>'+calls+'</strong><small>درخواست تماس</small></div></section>'+
 (activeView==='dashboard'?dashboardView(f,cats,sources):activeView==='feedback'?feedbackView(f):insightsView(d,cats,sources))+
 '</main><div class="mobile-nav"><button class="'+(activeView==='dashboard'?'active':'')+'" id="mDash">⌂<br>داشبورد</button><button class="'+(activeView==='feedback'?'active':'')+'" id="mFeed">◉<br>بازخورد</button><button class="'+(activeView==='insights'?'active':'')+'" id="mInsight">◌<br>تحلیل</button></div>'+
 '<div class="drawer" id="drawer"><div class="drawer-card" id="drawerCard"></div></div></div>';
 bind();
}
function dashboardView(f,cats,sources){
 return '<div class="grid"><section class="panel"><div class="panel-head"><h2>آخرین صدای مشتری</h2><span>'+f.length+' مورد</span></div><div class="feedback-list">'+feedbackItems(f.slice(0,10))+'</div></section><section class="panel"><div class="panel-head"><h2>موارد مهم امروز</h2><span>نیاز به توجه</span></div><div class="attention"><div class="attention-card"><strong>'+f.filter(x=>x.contact_requested).length+'</strong><small>درخواست تماس</small></div><div class="attention-card"><strong>'+f.filter(x=>Number(x.overall_score)<=2).length+'</strong><small>تجربه ضعیف</small></div></div><div class="panel-head" style="margin-top:25px"><h2>عملکرد دسته‌ها</h2><span>میانگین از ۵</span></div>'+bars(cats)+'</section></div><div class="grid"><section class="panel"><div class="panel-head"><h2>منبع ورود بازخورد</h2><span>تعداد ثبت</span></div>'+sourceRows(sources)+'</section><section class="panel"><div class="panel-head"><h2>وضعیت سیستم</h2><span>زنده</span></div><div class="source-row"><b>اتصال داده</b><span class="pill green">متصل</span></div><div class="source-row"><b>آخرین بروزرسانی</b><span>'+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+'</span></div><div class="source-row"><b>پنل مدیر</b><span>Password Gateway</span></div></section></div>';
}
function feedbackView(f){return '<section class="panel"><div class="panel-head"><h2>همه بازخوردها</h2><span>برای جزئیات روی هر مورد بزنید</span></div><div class="feedback-list">'+feedbackItems(f)+'</div></section>'}
function insightsView(d,cats,sources){return '<div class="grid"><section class="panel"><div class="panel-head"><h2>امتیاز دسته‌ها</h2><span>میانگین کل</span></div>'+bars(cats)+'</section><section class="panel"><div class="panel-head"><h2>کانال‌ها</h2><span>سهم از کل</span></div>'+sourceRows(sources,d.length)+'</section></div><section class="panel" style="margin-top:14px"><div class="panel-head"><h2>برداشت مدیریتی</h2><span>از داده‌های ثبت‌شده</span></div><div class="attention"><div class="attention-card"><strong>'+avg(d,'overall_score')+'</strong><small>امتیاز تجربه کلی</small></div><div class="attention-card"><strong>'+((d.length?Math.round(d.filter(x=>Number(x.staff_score)>=4).length/d.length*100):0))+'%</strong><small>پرسنل با امتیاز ۴+</small></div></div></section>'}
function bars(cats){return cats.map((c,i)=>{const v=Number(avg(all,c[1]));return '<div class="bar-row"><div class="bar-meta"><span>'+c[0]+'</span><b>'+v.toFixed(1)+'/5</b></div><div class="bar-track"><div class="bar-fill '+(v<3?'red':'')+'" style="width:'+(Math.max(0,Math.min(100,v*20)))+'%"></div></div></div>'}).join('')}
function sourceRows(sources,total=all.length){const entries=Object.entries(sources).sort((a,b)=>b[1]-a[1]);return entries.length?'<div class="source-list">'+entries.map(([k,v])=>'<div class="source-row"><b>'+esc(labelSource(k))+'</b><span>'+v+(total?' · '+Math.round(v/total*100)+'%':'')+'</span></div>').join(''):'<div class="empty">هنوز داده‌ای برای تحلیل وجود ندارد.</div>'}
function feedbackItems(items){return items.length?items.map(x=>'<div class="feedback" data-id="'+esc(x.id)+'"><div class="feedback-main"><div><div class="feedback-title"><span class="score">'+esc(x.overall_score)+'/5</span><span>'+esc(x.comment?'بازخورد مشتری':'ثبت امتیاز')+'</span></div><p>'+esc(x.comment||'مشتری توضیحی ثبت نکرده است.')+'</p><div class="meta"><span class="pill">'+esc(labelSource(x.source))+'</span><span>'+new Date(x.created_at).toLocaleString('fa-IR')+'</span>'+(x.contact_requested?'<span class="pill red">پیگیری تماس</span>':'')+'</div></div><span>›</span></div></div>').join(''):'<div class="empty"><strong>هنوز بازخوردی ثبت نشده</strong>وقتی اولین مشتری فرم را تکمیل کند، داده اینجا نمایش داده می‌شود.</div>'}
function bind(){
 document.getElementById('logout').onclick=logout;document.getElementById('refresh').onclick=load;
 ['navDash','mDash'].forEach(id=>document.getElementById(id).onclick=()=>{activeView='dashboard';render()});
 ['navFeed','mFeed'].forEach(id=>document.getElementById(id).onclick=()=>{activeView='feedback';render()});
 ['navInsight','mInsight'].forEach(id=>document.getElementById(id).onclick=()=>{activeView='insights';render()});
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
 document.querySelectorAll('.feedback').forEach(el=>el.onclick=()=>openDetail(all.find(x=>String(x.id)===el.dataset.id)));
}
function openDetail(x){if(!x)return;const d=document.getElementById('drawer');const card=document.getElementById('drawerCard');card.innerHTML='<div class="drawer-head"><div><div class="eyebrow">CUSTOMER FEEDBACK</div><h2 style="margin:6px 0">جزئیات بازخورد</h2></div><button class="close" id="close">×</button></div><div class="detail-score">'+esc(x.overall_score)+'/5</div><div class="muted" style="font-size:11px">'+new Date(x.created_at).toLocaleString('fa-IR')+' · '+esc(labelSource(x.source))+'</div><div class="detail-block"><label>نظر مشتری</label><div class="detail-comment">'+esc(x.comment||'بدون توضیح')+'</div></div><div class="detail-block"><label>امتیازها</label><div class="attention"><div class="attention-card"><strong>'+esc(x.coffee_score)+'</strong><small>قهوه</small></div><div class="attention-card"><strong>'+esc(x.staff_score)+'</strong><small>پرسنل</small></div><div class="attention-card"><strong>'+esc(x.service_score)+'</strong><small>سرویس</small></div><div class="attention-card"><strong>'+esc(x.environment_score)+'</strong><small>فضا</small></div></div></div><div class="detail-block"><label>پیگیری</label><div class="meta"><span class="pill '+(x.contact_requested?'red':'green')+'">'+(x.contact_requested?'درخواست تماس دارد':'تماس نمی‌خواهد')+'</span>'+(x.phone?'<span class="pill">'+esc(x.phone)+'</span>':'')+(x.preferred_contact_time?'<span class="pill">'+esc(x.preferred_contact_time)+'</span>':'')+'</div></div><div class="detail-block"><label>وضعیت ثبت</label><div class="status-row"><button class="status-btn active">'+esc(x.status||'new')+'</button></div></div>';d.classList.add('open');document.getElementById('close').onclick=()=>d.classList.remove('open');d.onclick=e=>{if(e.target===d)d.classList.remove('open')}}
load();
})();
</script>
</body>
</html>
