<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARCO VOICE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#171717;font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(620px,100%);background:#fff;border:1px solid #e3ded5;border-radius:22px;padding:28px}.brand{font-weight:900;font-size:24px}.muted{color:#777}.h{font-size:28px;margin:14px 0 7px}.sub{color:#777;margin:0 0 24px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choices button{border:1px solid #ddd;background:#faf9f6;border-radius:11px;padding:11px}.choices button.on{background:#171717;color:#fff}.btn{width:100%;border:0;background:#171717;color:#fff;padding:13px;border-radius:11px;margin-top:16px}label{display:block;color:#777;font-size:12px;margin:14px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:#fff}textarea{min-height:100px}.success{text-align:center;padding:30px}.emoji{font-size:50px}.shell{min-height:100vh}.side{position:fixed;right:0;top:0;bottom:0;width:230px;background:#171717;color:#fff;padding:22px 14px}.side h2{margin:0 8px 28px}.side button{display:block;width:100%;border:0;background:transparent;color:#aaa;text-align:right;padding:11px;border-radius:9px;margin:4px 0}.side button:hover{background:#292929;color:#fff}.main{margin-right:230px;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logout{border:0;background:#eee;border-radius:9px;padding:9px 13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi,.panel{background:#fff;border:1px solid #e3ded5;border-radius:16px;padding:18px}.kpi small{color:#777}.kpi strong{display:block;font-size:27px;margin-top:8px}.panels{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.badge{background:#eee;border-radius:8px;padding:4px 7px;font-size:10px}.error{background:#f8e0e0;color:#8b3030;padding:10px;border-radius:9px;margin-top:10px}.ok{background:#e3f1e7;color:#27633f;padding:10px;border-radius:9px;margin-top:10px}.empty{text-align:center;color:#888;padding:25px}@media(max-width:800px){.side{position:static;width:100%;display:flex;align-items:center;overflow:auto;padding:10px}.side h2{margin:0 16px 0 8px;white-space:nowrap}.side button{width:auto;white-space:nowrap}.main{margin:0;padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.choices{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div id="app"></div>
<script>
const URL='https://jcpdzqilnhnljvrfsjug.supabase.co',KEY='sb_publishable_IsYn6XHFo7AUOfE0BDyfZA_sjavx6Vr',db=supabase.createClient(URL,KEY),app=document.getElementById('app');
const bootPath=new URLSearchParams(location.search).get('__route');
if(bootPath){history.replaceState({},'',bootPath);}
const path=location.pathname.replace(/\/+$/,'')||'/';
const mode='customer';
const params=new URLSearchParams(location.search);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shell=x=>'<div class="wrap"><div class="card">'+x+'</div></div>';
async function branch(){let{data,error}=await db.from('dv_branches').select('*').eq('code','GILAVAND').single();if(error)throw error;return data}
function customer(){
 let a={overall:0,coffee:0,staff:0,service:0,environment:0,comment:'',contact:false,phone:'',time:''},step=0;
 async function render(){
  let c='<div class="brand">DARCO VOICE</div>';
  if(step===0)c+='<h1 class="h">تجربه‌ات با دارکو چطور بود؟</h1><p class="sub">۳۰ ثانیه وقت می‌گیره. ولی به ما کمک می‌کنه بهتر بشیم.</p><button id="go" class="btn">شروع کنیم</button>';
  if(step===1)c+='<h2>در مجموع، تجربه‌ات چطور بود؟</h2><div class="choices">'+['خیلی بد','بد','معمولی','خوب','عالی'].map((x,i)=>'<button data-o="'+(i+1)+'" class="'+(a.overall===i+1?'on':'')+'">'+x+'</button>').join('')+'</div>';
  if(step===2)c+='<h2>چند بخش رو هم جدا ارزیابی کن</h2>'+[['coffee','کیفیت قهوه'],['staff','برخورد پرسنل'],['service','سرعت سرویس'],['environment','فضای دارکو']].map(z=>'<label>'+z[1]+'</label><div class="choices">'+[1,2,3,4,5].map(n=>'<button data-k="'+z[0]+'" data-v="'+n+'" class="'+(a[z[0]]===n?'on':'')+'">'+n+'</button>').join('')+'</div>').join('')+'<button id="next" class="btn">ادامه</button>';
  if(step===3)c+='<h2>اگر فقط یک چیز را بهتر کنیم، چی باشه؟</h2><textarea id="comment" placeholder="نظر واقعی تو..."></textarea><button id="next" class="btn">ادامه</button>';
  if(step===4)c+='<h2>دوست داری اگر لازم بود باهات تماس بگیریم؟</h2><div class="choices"><button id="yes" class="'+(a.contact?'on':'')+'">بله</button><button id="no" class="'+(!a.contact?'on':'')+'">نه</button></div>'+(a.contact?'<label>شماره موبایل</label><input id="phone" inputmode="tel" placeholder="09..."><label>زمان مناسب تماس</label><input id="time" placeholder="مثلاً ۱۸ تا ۲۰">':'')+'<button id="submit" class="btn">ثبت بازخورد</button>';
  if(step===5)c='<div class="success"><div class="emoji">☕</div><h2>ممنون که صدات رو با ما به اشتراک گذاشتی.</h2><p class="muted">صدای تو بخشی از بهتر شدن دارکوئه.</p></div>';
  app.innerHTML=shell(c);
  if(step===0)go.onclick=()=>{step=1;render()};
  if(step===1)document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{a.overall=+b.dataset.o;step=2;render()});
  if(step===2){document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{a[b.dataset.k]=+b.dataset.v;render()});next.onclick=()=>{if([a.coffee,a.staff,a.service,a.environment].every(Boolean)){step=3;render()}}}
  if(step===3){next.onclick=()=>{a.comment=comment.value;step=4;render()}}
  if(step===4){
   yes.onclick=()=>{a.contact=true;render()};no.onclick=()=>{a.contact=false;render()};
   submit.onclick=async()=>{submit.disabled=true;a.phone=document.getElementById('phone')?.value||'';a.time=document.getElementById('time')?.value||'';try{let b=await branch();let{error}=await db.from('dv_customer_feedback').insert({branch_id:b.id,source:params.get('source')||'table_qr',overall_score:a.overall,coffee_score:a.coffee,staff_score:a.staff,service_score:a.service,environment_score:a.environment,comment:a.comment,contact_requested:a.contact,phone:a.contact?a.phone:null,preferred_contact_time:a.contact?a.time:null,status:'new'});if(error)throw error;step=5;render()}catch(e){alert('ثبت انجام نشد: '+e.message);submit.disabled=false}}}
 }
 render();
}
function go(p){history.pushState({},'',p);run()}
function nav(){return '<aside class="side"><h2>DARCO VOICE</h2><button onclick="go(\'/hq\')">Manager HQ</button><button onclick="go(\'/staff\')">Staff Voice</button><button onclick="go(\'/customer\')">فرم مشتری</button><button onclick="logout()">خروج</button></aside>'}
async function logout(){await db.auth.signOut();go('/hq')}
async function profile(u){let{data,error}=await db.from('dv_profiles').select('*').eq('id',u.id).single();if(error)throw error;return data}
function login(kind,done){
 app.innerHTML=shell('<div class="brand">DARCO VOICE</div><h2>'+kind+'</h2><p class="sub">ایمیل و رمز حساب دارکو را وارد کن.</p><label>ایمیل</label><input id="email" type="email"><label>رمز عبور</label><input id="pass" type="password"><button id="login" class="btn">ورود</button><div id="msg"></div>');
 login.onclick=async()=>{login.disabled=true;let{data,error}=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(error){msg.innerHTML='<div class="error">'+esc(error.message)+'</div>';login.disabled=false;return}try{await done(data.user)}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>';await db.auth.signOut();login.disabled=false}};
}
async function hq(u){
 let p=await profile(u);if(!['manager','admin'].includes(p.role))throw new Error('این حساب دسترسی Manager ندارد.');
 let{data,error}=await db.from('dv_customer_feedback').select('*').order('created_at',{ascending:false});if(error)throw error;data=data||[];
 let avg=data.length?(data.reduce((s,x)=>s+x.overall_score,0)/data.length).toFixed(1):'0.0',sat=data.length?Math.round(data.filter(x=>x.overall_score>=4).length/data.length*100):0;
 app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="top"><div><h1>Manager HQ</h1><p class="muted">مرکز فرماندهی تجربه مشتری</p></div><button class="logout" onclick="logout()">خروج</button></div><div class="kpis"><div class="kpi"><small>رضایت میانگین</small><strong>'+avg+'/5</strong></div><div class="kpi"><small>نرخ رضایت</small><strong>'+sat+'%</strong></div><div class="kpi"><small>بازخورد</small><strong>'+data.length+'</strong></div><div class="kpi"><small>نیازمند تماس</small><strong>'+data.filter(x=>x.contact_requested).length+'</strong></div></div><div class="panels"><section class="panel"><h3>آخرین صدای مشتری</h3>'+ (data.slice(0,15).map(x=>'<div class="row"><span><b>'+x.overall_score+'/5</b> '+esc(x.comment||'بدون توضیح')+'<br><small class="muted">'+new Date(x.created_at).toLocaleString('fa-IR')+' · '+esc(x.source)+'</small></span><span class="badge">'+(x.contact_requested?'تماس':'بدون تماس')+'</span></div>').join('')||'<div class="empty">هنوز بازخوردی ثبت نشده.</div>')+'</section><section class="panel"><h3>امتیاز دسته‌ها</h3>'+[['کیفیت قهوه','coffee_score'],['برخورد پرسنل','staff_score'],['سرعت سرویس','service_score'],['فضا','environment_score']].map(z=>{let v=data.length?(data.reduce((s,x)=>s+(x[z[1]]||0),0)/data.length).toFixed(1):'0.0';return '<div class="row"><span>'+z[0]+'</span><b>'+v+'/5</b></div>'}).join('')+'</section></div></main></div>';
}
async function staff(u){
 let p=await profile(u);if(p.role!=='staff')throw new Error('این حساب دسترسی Staff ندارد.');
 let{data:rs}=await db.from('dv_staff_reports').select('*').eq('staff_id',u.id).order('created_at',{ascending:false});
 app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="top"><div><h1>Staff Voice</h1><p class="muted">سلام '+esc(p.full_name||'')+'، گزارش شیفت را ثبت کن.</p></div><button class="logout" onclick="logout()">خروج</button></div><div class="panels"><section class="panel"><h3>گزارش شیفت</h3><label>وضعیت کلی</label><div class="choices"><button data-s="good">خوب</button><button data-s="normal">معمولی</button><button data-s="bad">بد</button></div><label>مشکل اصلی</label><select id="issue"><option>service</option><option>inventory</option><option>coffee</option><option>machine</option><option>customer</option><option>cleaning</option><option>other</option></select><label>چه اتفاقی افتاد؟</label><textarea id="desc"></textarea><label>اگر فردا یک چیز را تغییر می‌دادی؟</label><textarea id="suggest"></textarea><button id="save" class="btn">ثبت گزارش</button><div id="msg"></div></section><section class="panel"><h3>گزارش‌های من</h3>'+((rs||[]).map(r=>'<div class="row"><span>'+esc(r.description||'بدون توضیح')+'<small class="muted">'+new Date(r.created_at).toLocaleString('fa-IR')+'</small></span><span class="badge">'+esc(r.overall_shift_status)+'</span></div>').join('')||'<div class="empty">هنوز گزارشی ثبت نشده.</div>')+'</section></div></main></div>';
 let status='normal';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
 save.onclick=async()=>{let b=await branch(),{error}=await db.from('dv_staff_reports').insert({staff_id:u.id,branch_id:b.id,shift:'current',overall_shift_status:status,description:desc.value,customer_pattern:'',suggestion:suggest.value});if(error)msg.innerHTML='<div class="error">'+esc(error.message)+'</div>';else msg.innerHTML='<div class="ok">گزارش با موفقیت ثبت شد.</div>'};
}
async function run(){
 try{
  if(mode==='customer'){customer();return}
  let{data:{session}}=await db.auth.getSession();
  if(!session){login(mode==='hq'?'Manager HQ':'Staff Voice',async u=>mode==='hq'?hq(u):staff(u));return}
  if(mode==='hq')await hq(session.user);else if(mode==='staff')await staff(session.user);else customer();
 }catch(e){app.innerHTML=shell('<div class="brand">DARCO VOICE</div><h2>خطا</h2><div class="error">'+esc(e.message)+'</div>')}
}
window.addEventListener('popstate',run);run();
</script></body></html>
