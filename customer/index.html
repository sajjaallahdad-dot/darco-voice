  if(step===1)h+='<h2>در مجموع، تجربه‌ات چطور بود؟</h2><div class="choices">'+['خیلی بد','بد','معمولی','خوب','عالی'].map((x,i)=>'<button data-o="'+(i+1)+'">'+x+'</button>').join('')+'</div>';

function go(p){location.href=location.origin+'/darco-voice'+p;}
function nav(){return '<aside class="side"><h2>DARCO VOICE</h2><button data-nav="/hq">Manager HQ</button><button data-nav="/staff">Staff Voice</button><button data-nav="/customer">فرم مشتری</button><button id="logout">خروج</button></aside>';}
function bindNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));const x=document.getElementById('logout');if(x)x.onclick=async()=>{await db.auth.signOut();go('/hq');};}

function login(title,done){app.innerHTML=card('<div class="brand">DARCO VOICE</div><h2>'+title+'</h2><label>ایمیل</label><input id="email" type="email"><label>رمز عبور</label><input id="pass" type="password"><button id="login" class="btn">ورود</button><div id="msg"></div>');document.getElementById('login').onclick=async()=>{const b=document.getElementById('login');b.disabled=true;const r=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});if(r.error){document.getElementById('msg').innerHTML='<div class="error">'+esc(r.error.message)+'</div>';b.disabled=false;return;}try{await done(r.data.user);}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>';await db.auth.signOut();b.disabled=false;}};}
async function hq(u){const p=await profile(u);if(!['manager','admin'].includes(p.role))throw Error('این حساب دسترسی Manager ندارد.');const r=await db.from('dv_customer_feedback').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;const d=r.data||[],avg=d.length?(d.reduce((a,x)=>a+Number(x.overall_score||0),0)/d.length).toFixed(1):'0.0',sat=d.length?Math.round(d.filter(x=>+x.overall_score>=4).length/d.length*100):0;app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="top"><div><h1>Manager HQ</h1><p class="muted">مرکز فرماندهی تجربه مشتری</p></div></div><div class="kpis"><div class="kpi">رضایت میانگین<strong>'+avg+'/5</strong></div><div class="kpi">نرخ رضایت<strong>'+sat+'%</strong></div><div class="kpi">بازخورد<strong>'+d.length+'</strong></div><div class="kpi">نیازمند تماس<strong>'+d.filter(x=>x.contact_requested).length+'</strong></div></div><div class="panels"><section class="panel"><h3>آخرین صدای مشتری</h3>'+(d.slice(0,15).map(x=>'<div class="row"><span><b>'+esc(x.overall_score)+'/5</b> '+esc(x.comment||'بدون توضیح')+'<small class="muted">'+new Date(x.created_at).toLocaleString('fa-IR')+'</small></span><span class="badge">'+(x.contact_requested?'تماس':'بدون تماس')+'</span></div>').join('')||'<div class="empty">هنوز بازخوردی ثبت نشده.</div>')+'</section><section class="panel"><h3>امتیاز دسته‌ها</h3>'+[['کیفیت قهوه','coffee_score'],['برخورد پرسنل','staff_score'],['سرعت سرویس','service_score'],['فضا','environment_score']].map(z=>'<div class="row"><span>'+z[0]+'</span><b>'+(d.length?(d.reduce((a,x)=>a+Number(x[z[1]]||0),0)/d.length).toFixed(1):'0.0')+'/5</b></div>').join('')+'</section></div></main></div>';bindNav();}
async function staff(u){const p=await profile(u);if(p.role!=='staff')throw Error('این حساب دسترسی Staff ندارد.');const r=await db.from('dv_staff_reports').select('*').eq('staff_id',u.id).order('created_at',{ascending:false}),rs=r.data||[];app.innerHTML='<div class="shell">'+nav()+'<main class="main"><div class="top"><div><h1>Staff Voice</h1><p class="muted">سلام '+esc(p.full_name||'')+'، گزارش شیفت را ثبت کن.</p></div></div><div class="panels"><section class="panel"><h3>گزارش شیفت</h3><label>وضعیت کلی</label><div class="choices"><button data-s="good">خوب</button><button data-s="normal">معمولی</button><button data-s="bad">بد</button></div><label>چه اتفاقی افتاد؟</label><textarea id="desc"></textarea><label>اگر فردا یک چیز را تغییر می‌دادی؟</label><textarea id="suggest"></textarea><button id="save" class="btn">ثبت گزارش</button><div id="msg"></div></section><section class="panel"><h3>گزارش‌های من</h3>'+(rs.map(x=>'<div class="row"><span>'+esc(x.description||'بدون توضیح')+'<small>'+new Date(x.created_at).toLocaleString('fa-IR')+'</small></span><span class="badge">'+esc(x.overall_shift_status)+'</span></div>').join('')||'<div class="empty">هنوز گزارشی ثبت نشده.</div>')+'</section></div></main></div>';bindNav();let status='normal';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');});document.getElementById('save').onclick=async()=>{const b=await branch(),x=await db.from('dv_staff_reports').insert({staff_id:u.id,branch_id:b.id,shift:'current',overall_shift_status:status,description:document.getElementById('desc').value,customer_pattern:'',suggestion:document.getElementById('suggest').value});document.getElementById('msg').innerHTML=x.error?'<div class="error">'+esc(x.error.message)+'</div>':'<div class="ok">گزارش با موفقیت ثبت شد.</div>';};}
