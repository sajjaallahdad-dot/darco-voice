<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f090d"><title>دارکو | صدای مشتری</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--red:#9e080d;--red2:#c91b22;--black:#100607;--cream:#f5efe6;--paper:#fffdf9;--ink:#171312;--muted:#776e68;--line:#e4d9cf}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Vazirmatn,Arial,sans-serif}body{background:#100607;color:#fff}button,input,textarea{font:inherit}button{cursor:pointer}
.page{min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 9%,#c21a21 0,#73080d 28%,#24070a 62%,#100607 100%)}.page:before{content:"";position:absolute;inset:0;opacity:.08;background-image:linear-gradient(90deg,#fff 1px,transparent 1px),linear-gradient(#fff 1px,transparent 1px);background-size:30px 30px;pointer-events:none}.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:#d6222a;filter:blur(100px);opacity:.22;left:-180px;bottom:-160px}
.shell{width:min(1180px,100%);margin:auto;padding:24px;position:relative;z-index:2}.topbar{display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:11px}.logo-mark{width:44px;height:44px;border:2px solid #fff;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:30px}.logo-word{font-weight:900;letter-spacing:2px;font-size:16px}.logo-word small{display:block;font-size:8px;letter-spacing:3px;opacity:.6}.pill{border:1px solid #ffffff35;background:#ffffff0e;padding:9px 13px;border-radius:99px;font-size:10px;color:#fff9}
.hero{display:grid;grid-template-columns:1fr .9fr;align-items:center;min-height:calc(100dvh - 90px);gap:20px}.copy{padding:50px 0 30px}.eyebrow{font-size:10px;letter-spacing:3px;color:#ffffff9c;margin-bottom:18px}.headline{font-size:clamp(46px,7vw,92px);line-height:1.03;letter-spacing:-5px;margin:0}.headline em{font-style:normal;color:#ffbdbe}.lead{font-size:15px;line-height:2;color:#fff9;margin:24px 0;max-width:560px}.cta{display:flex;gap:10px;flex-wrap:wrap}.primary{border:0;background:var(--cream);color:var(--ink);padding:15px 23px;border-radius:13px;font-weight:900;box-shadow:0 16px 35px #0005}.secondary{border:1px solid #fff4;background:#ffffff0d;color:#fff;padding:14px 18px;border-radius:13px}
.remi-stage{min-height:650px;display:grid;place-items:center}.remi-card{width:min(470px,90%);aspect-ratio:3/4;border-radius:34px;background:linear-gradient(160deg,#d31c24,#82070c 65%,#4d070b);box-shadow:0 35px 90px #0009;position:relative;overflow:hidden;border:1px solid #ffffff25}.remi-card:before{content:"";position:absolute;inset:16px;border:1px solid #ffffff22;border-radius:25px}.remi-label{position:absolute;right:28px;top:26px;font-size:9px;letter-spacing:2px;opacity:.7}.spark{position:absolute;left:30px;bottom:30px;font-size:24px;color:#ffd8a0}
.remi{position:absolute;inset:8% 7% 2%;display:grid;place-items:end center}.owlhead{position:absolute;top:10%;width:45%;aspect-ratio:1;border-radius:48% 48% 43% 43%;background:radial-gradient(circle at 35% 35%,#f7dfc4,#b67d57 65%,#6b3c2d);z-index:3;box-shadow:inset 0 -18px 30px #4c211855}.eye{position:absolute;top:39%;width:29%;aspect-ratio:1;border-radius:50%;background:#17100e;box-shadow:inset 0 0 0 10px #e6c7a6}.eye:after{content:"";position:absolute;inset:30%;border-radius:50%;background:#050404}.eye.l{left:13%}.eye.r{right:13%}.beak{position:absolute;top:61%;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #221512;z-index:5}.glasses{position:absolute;top:34%;width:75%;height:18%;z-index:6;display:flex;gap:3%;justify-content:center}.glass{width:42%;height:100%;border:4px solid #090909;background:#050505aa;border-radius:12px}.shirt{position:absolute;bottom:9%;width:66%;height:49%;background:#a9c6dd;border-radius:35px 35px 18px 18px;z-index:2;box-shadow:inset 0 -18px 30px #66849a33}.collar{position:absolute;top:0;width:100%;height:70px}.collar:before,.collar:after{content:"";position:absolute;top:0;width:30%;height:70px;background:#dbe8f1}.collar:before{right:50%;clip-path:polygon(100% 0,0 0,80% 100%)}.collar:after{left:50%;clip-path:polygon(0 0,100% 0,20% 100%)}.shirt-line{position:absolute;left:50%;top:25px;bottom:0;width:2px;background:#7894a8}.button{position:absolute;left:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:#eee;top:90px}.b2{top:145px}.shorts{position:absolute;bottom:2%;width:58%;height:17%;background:#3d3a3a;border-radius:8px 8px 30px 30px;z-index:1}.leg{position:absolute;bottom:0;width:12%;height:22%;background:#a87554;border-radius:40px}.leg.l{left:35%}.leg.r{right:35%}.shoe{position:absolute;bottom:-1%;width:22%;height:8%;background:#1f355b;border-radius:16px 16px 8px 8px;z-index:4}.shoe.l{left:24%}.shoe.r{right:24%}.cup{position:absolute;bottom:26%;right:13%;width:16%;height:17%;background:#d6a16d;border-radius:5px 5px 13px 13px;z-index:7;box-shadow:inset 0 10px #7a482b}.straw{position:absolute;width:2px;height:20%;background:#211712;right:20%;bottom:42%;transform:rotate(2deg);z-index:8}
.card-wrap{background:var(--cream);color:var(--ink);min-height:100dvh;padding:9px}.form-card{width:min(680px,100%);margin:auto;background:var(--paper);border-radius:30px;box-shadow:0 30px 90px #0007;padding:28px}.form-top{display:flex;justify-content:space-between;align-items:center}.form-brand{font-weight:900;letter-spacing:2px}.form-brand span{color:var(--red)}.step{font-size:10px;color:var(--muted)}.question{font-size:31px;line-height:1.3;letter-spacing:-1.3px;margin:42px 0 22px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choices.two{grid-template-columns:1fr 1fr}.choice{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:15px 6px;min-height:56px}.choice.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 10px 25px #9e080d28}.next{width:100%;border:0;background:var(--ink);color:#fff;padding:16px;border-radius:14px;margin-top:22px;font-weight:900}.field-label{font-size:11px;color:var(--muted);font-weight:800;margin:20px 0 8px;display:block}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;color:var(--ink);outline:0}textarea{min-height:140px;resize:vertical}.error{margin-top:12px;background:#fff0ee;color:#9e080d;border:1px solid #efc9c4;padding:12px;border-radius:12px;font-size:12px}.success{text-align:center;padding:50px 10px}.success h2{font-size:34px}.mini-remi{width:150px;height:150px;margin:auto;border-radius:40px;background:var(--red);display:grid;place-items:center}.mini-owl{width:92px;height:92px;position:relative}.mini-owl .face{position:absolute;inset:10px;border-radius:48%;background:#f1d2b5}.mini-owl .e{position:absolute;top:38px;width:20px;height:20px;border-radius:50%;background:#111}.mini-owl .e:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#c91b22}.mini-owl .e1{left:18px}.mini-owl .e2{right:18px}.mini-owl .bk{position:absolute;top:57px;left:37px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:18px solid #211}.mini-owl .shirt2{position:absolute;bottom:0;left:12px;right:12px;height:40px;background:#a9c6dd;border-radius:22px 22px 10px 10px}
@media(max-width:780px){.shell{padding:16px}.hero{grid-template-columns:1fr;min-height:auto}.copy{padding:65px 0 20px}.headline{font-size:48px;letter-spacing:-3px}.lead{font-size:14px}.remi-stage{min-height:430px}.remi-card{width:min(330px,86vw)}}@media(max-width:560px){.pill{display:none}.headline{font-size:43px}.remi-stage{min-height:380px}.form-card{padding:21px 17px;border-radius:24px}.question{font-size:26px;margin:35px 0 19px}.choices{gap:5px}.choice{min-height:52px;font-size:13px;padding:10px 3px}.card-wrap{padding:9px}}
</style></head>
<body><div id="app"></div>
<script>
const BRANCH_ID='a0e47b77-05fd-41a8-a8a8-527bc866eabf';
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const miniRemi=()=>'<div class="mini-owl"><div class="face"></div><div class="e e1"></div><div class="e e2"></div><div class="bk"></div><div class="shirt2"></div></div>';
const remi=()=>'<div class="remi"><div class="owlhead"><div class="eye l"></div><div class="eye r"></div><div class="beak"></div><div class="glasses"><div class="glass"></div><div class="glass"></div></div></div><div class="shirt"><div class="collar"></div><div class="shirt-line"></div><div class="button"></div><div class="button b2"></div></div><div class="shorts"></div><div class="leg l"></div><div class="leg r"></div><div class="shoe l"></div><div class="shoe r"></div><div class="cup"></div><div class="straw"></div></div>';
function form(){
 const s={overall:0,coffee:0,staff:0,service:0,environment:0,comment:'',contact:false,phone:'',time:''};let step=0;
 const render=()=>{let h='<div class="form-top"><div class="form-brand">DARCO <span>VOICE</span></div><div class="step">GILAVAND · '+(step<5?step+1:5)+'/5</div></div>';
 if(step===0)h+='<div style="text-align:center;padding:40px 0 15px"><div class="mini-remi">'+miniRemi()+'</div><h1 class="question" style="margin-bottom:12px">صدای تو، بخشی از دارکوئه.</h1><p style="color:#776e68;line-height:1.9">کمتر از یک دقیقه وقت بگذار و تجربه‌ات را برای ما ثبت کن.</p><button class="next" id="start">شروع تجربه</button></div>';
 if(step===1)h+='<h2 class="question">تجربه کلی‌ات چطور بود؟</h2><div class="choices">'+['خیلی بد','بد','معمولی','خوب','عالی'].map((x,i)=>'<button class="choice '+(s.overall===i+1?'on':'')+'" data-o="'+(i+1)+'">'+x+'</button>').join('')+'</div>';
 if(step===2)h+='<h2 class="question">چهار نقطه از تجربه را امتیاز بده.</h2>'+[['coffee','کیفیت قهوه'],['staff','برخورد پرسنل'],['service','سرعت سرویس'],['environment','فضای دارکو']].map(z=>'<label class="field-label">'+z[1]+'</label><div class="choices">'+[1,2,3,4,5].map(n=>'<button class="choice '+(s[z[0]]===n?'on':'')+'" data-k="'+z[0]+'" data-v="'+n+'">'+n+'</button>').join('')+'</div>').join('')+'<button class="next" id="next2">ادامه</button>';
 if(step===3)h+='<h2 class="question">اگر فقط یک چیز را بهتر کنیم، چه باشد؟</h2><textarea id="comment" placeholder="هر چیزی که به ذهنت می‌رسد...">'+esc(s.comment)+'</textarea><button class="next" id="next3">ادامه</button>';
 if(step===4)h+='<h2 class="question">اگر لازم باشد، دوست داری باهات تماس بگیریم؟</h2><div class="choices two"><button id="yes" class="choice '+(s.contact?'on':'')+'">بله</button><button id="no" class="choice '+(!s.contact?'on':'')+'">نه</button></div>'+(s.contact?'<label class="field-label">شماره موبایل</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثلاً 09121234567" value="'+esc(s.phone)+'"><label class="field-label">زمان مناسب تماس</label><div class="choices two"><button id="morning" class="choice '+(s.time==='morning'?'on':'')+'">صبح</button><button id="evening" class="choice '+(s.time==='evening'?'on':'')+'">عصر</button></div>':'')+'<button class="next" id="submit">ثبت بازخورد</button><div id="msg"></div>';
 if(step===5)h='<div class="success"><div class="form-top"><div class="form-brand">DARCO <span>VOICE</span></div></div><div style="height:35px"></div><div class="mini-remi">'+miniRemi()+'</div><h2>صدات رسید.</h2><p style="color:#776e68">ممنون که دارکو را بهتر می‌کنی.</p></div>';
 app.innerHTML='<div class="card-wrap"><div class="form-card">'+h+'</div></div>';
 const q=id=>document.getElementById(id);
 if(q('start'))q('start').onclick=()=>{step=1;render()};document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{s.overall=+b.dataset.o;step=2;render()});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{s[b.dataset.k]=+b.dataset.v;render()});
 if(q('next2'))q('next2').onclick=()=>{if([s.coffee,s.staff,s.service,s.environment].every(Boolean)){step=3;render()}};
 if(q('next3'))q('next3').onclick=()=>{s.comment=q('comment').value;step=4;render()};if(q('yes'))q('yes').onclick=()=>{s.contact=true;render()};if(q('no'))q('no').onclick=()=>{s.contact=false;render()};if(q('morning'))q('morning').onclick=()=>{s.time='morning';render()};if(q('evening'))q('evening').onclick=()=>{s.time='evening';render()};
 if(q('submit'))q('submit').onclick=async()=>{const b=q('submit');b.disabled=true;s.phone=(q('phone')?.value||'').trim();try{if(s.contact&&!s.phone)throw Error('لطفاً شماره موبایل را وارد کنید.');const r=await submitFeedback(s);if(r.error)throw r.error;step=5;render()}catch(e){q('msg').innerHTML='<div class="error">'+esc(e.message)+'</div>';b.disabled=false}};
 };
 render();
}
async function submitFeedback(s){
 const source=new URLSearchParams(location.search).get('source')||'table_qr';
 const src=await fetch('../customer/index.html').then(r=>r.text());
 const m=src.match(/createClient\('([^']+)','([^']+)'\)/);
 if(!m)throw Error('اتصال سیستم بازخورد پیدا نشد.');
 if(!window.supabase){const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.appendChild(sc);await new Promise((ok,no)=>{sc.onload=ok;sc.onerror=no})}
 const client=window.supabase.createClient(m[1],m[2]);
 return await client.from('dv_customer_feedback').insert({branch_id:BRANCH_ID,source,overall_score:s.overall,coffee_score:s.coffee,staff_score:s.staff,service_score:s.service,environment_score:s.environment,comment:s.comment,contact_requested:s.contact,phone:s.contact?s.phone:null,preferred_contact_time:s.contact?s.time:null,status:'new'});
}
function landing(){app.innerHTML='<div class="page"><div class="glow"></div><div class="shell"><div class="topbar"><div class="logo"><div class="logo-mark">D</div><div class="logo-word">DARCO<small>ROASTERY</small></div></div><div class="pill">DARCO VOICE · GILAVAND</div></div><div class="hero"><section class="copy"><div class="eyebrow">YOUR EXPERIENCE MATTERS</div><h1 class="headline">دارکو را<br><em>با صدای تو</em><br>بهتر می‌کنیم.</h1><p class="lead">این صفحه برای یک نظر معمولی ساخته نشده. می‌خواهیم دقیق بدانیم کجای تجربه‌ات خوب بود، کجا باید بهتر شویم و چه چیزی ارزش برگشتن دوباره را دارد.</p><div class="cta"><button class="primary" id="begin">ثبت نظر من</button><button class="secondary" id="skip">۳۰ ثانیه تا پایان</button></div></section><section class="remi-stage"><div class="remi-card"><span class="remi-label">REMI · DARCO MASCOT</span>'+remi()+'<span class="spark">✦</span></div></section></div></div></div>';document.getElementById('begin').onclick=form;document.getElementById('skip').onclick=form}
landing();
</script></body></html>
